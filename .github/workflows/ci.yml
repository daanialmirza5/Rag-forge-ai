name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ragforge
          POSTGRES_PASSWORD: ragforge
          POSTGRES_DB: ragforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ragforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # pytest-dotenv loads backend/.env.test (see pyproject.toml), which is
      # intentionally not committed (anything matching .env.* is gitignored
      # by policy, even the dummy test-only values) — the checked-in
      # .env.test.example already targets these exact service container
      # ports/credentials, so it's usable as-is in CI.
      - name: Prepare test environment file
        run: cp .env.test.example .env.test

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Type-check (mypy)
        run: mypy app --ignore-missing-imports

      - name: Test (unit + integration, real Postgres/Redis)
        run: pytest tests/unit tests/integration -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Verifies both Dockerfiles actually build — this is the one CI check
      # that catches image-level breakage (missing files, apt/npm resolution)
      # that lint/typecheck/test can't. Images are built and discarded, not
      # pushed: wire up a registry + credentials (e.g. GHCR) here to enable
      # push-on-merge once one is available.
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
