[project]
name = "ragforge-backend"
version = "0.1.0"
description = "RAGForge AI backend: FastAPI service + Celery workers for a multi-tenant RAG SaaS platform"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "email-validator>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.13.3",
    "celery[redis]>=5.4.0",
    "redis>=5.1.0",
    "bcrypt>=4.1.0",
    "pyjwt[crypto]>=2.9.0",
    "python-multipart>=0.0.12",
    "anthropic>=0.68.0",
    "voyageai>=0.3.0",
    "qdrant-client>=1.11.0",
    "langgraph>=0.2.0",
    "langchain-text-splitters>=0.3.0",
    "rank-bm25>=0.2.2",
    "pypdf>=5.0.0",
    "pdfplumber>=0.11.4",
    "python-docx>=1.1.2",
    "beautifulsoup4>=4.12.3",
    "markdown>=3.7",
    "pytesseract>=0.3.13",
    "pdf2image>=1.17.0",
    "pillow>=10.4.0",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "httpx>=0.27.2",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "prometheus-client>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.2",
    "ruff>=0.7.0",
    "mypy>=1.11.2",
    "pre-commit>=3.8.0",
    "faker>=30.1.0",
    "aiosqlite>=0.20.0",
    "pytest-dotenv>=0.5.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Session-scoped, not the pytest-asyncio default of one event loop per test
# function: `app` (in app/main.py) is a module-level singleton, same as in
# production, and its `RateLimitMiddleware` opens a Redis connection once at
# construction time. A fresh loop per test orphans that connection's
# transport after the first test's loop closes, so every subsequent test
# hits "RuntimeError: Event loop is closed" the moment it touches a
# non-exempt route (found by actually running the integration suite for the
# first time against a real Redis, not caught by review). One loop for the
# whole session matches production's "one process, one loop" model that the
# app already assumes.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
env_files = [".env.test"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
